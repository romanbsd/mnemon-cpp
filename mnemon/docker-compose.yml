services:
  postgres:
    image: postgres:18-alpine
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: mnemon
      POSTGRES_PASSWORD: mnemon
      POSTGRES_DB: mnemon
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemon -d mnemon"]
      interval: 2s
      timeout: 5s
      retries: 20

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_EMBEDDINGS: 1
      LLAMA_ARG_HF_REPO: nomic-ai/nomic-embed-text-v1.5-GGUF
      LLAMA_ARG_HF_FILE: nomic-embed-text-v1.5.Q8_0.gguf
      LLAMA_ARG_CTX_SIZE: 2048
      LLAMA_ARG_POOLING: mean
      LLAMA_CACHE: /models
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - llama-models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 180s

volumes:
  llama-models:
